name: CI

# 什么情况下触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 具体要做什么
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2

      - name: 安装 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install-frozen-lockfile

      - name: 代码检查 (Lint)
        run: pnpm lint

      - name: 构建
        run: pnpm build
